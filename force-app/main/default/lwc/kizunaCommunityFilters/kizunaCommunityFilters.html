<template>
    <div class="filters-panel">

        <!-- Header -->
        <div class="panel-header">
            <svg class="panel-icon" viewBox="0 0 24 24">
                <line x1="4" y1="6" x2="20" y2="6"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
                <line x1="11" y1="18" x2="13" y2="18"/>
            </svg>
            <span>Filters</span>
        </div>

        <!-- Events Filters -->
        <div class="filter-section">
            <p class="filter-section-label">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M16 2v4M8 2v4M3 10h18"/>
                </svg>
                Events
            </p>
            <div class="filter-field">
                <lightning-combobox
                    name="eventStatus"
                    label="Status"
                    variant="label-stacked"
                    value={eventStatus}
                    options={eventStatusOptions}
                    onchange={handleEventStatusChange}>
                </lightning-combobox>
            </div>
            <div class="filter-field">
                <lightning-input
                    type="search"
                    label="Search Events"
                    placeholder="Name or venue..."
                    onchange={handleEventSearchChange}>
                </lightning-input>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Programs Filters -->
        <div class="filter-section">
            <p class="filter-section-label">
                <svg class="label-icon" viewBox="0 0 24 24">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                Programs
            </p>
            <div class="filter-field">
                <lightning-combobox
                    name="programStatus"
                    label="Status"
                    variant="label-stacked"
                    value={programStatus}
                    options={programStatusOptions}
                    onchange={handleProgramStatusChange}>
                </lightning-combobox>
            </div>
            <div class="filter-field">
                <lightning-combobox
                    name="programType"
                    label="Type"
                    variant="label-stacked"
                    value={programType}
                    options={programTypeOptions}
                    onchange={handleProgramTypeChange}>
                </lightning-combobox>
            </div>
            <div class="filter-field">
                <lightning-input
                    type="search"
                    label="Search Programs"
                    placeholder="Name or description..."
                    onchange={handleProgramSearchChange}>
                </lightning-input>
            </div>
        </div>

    </div>
</template>
