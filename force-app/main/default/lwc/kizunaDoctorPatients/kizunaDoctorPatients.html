<template>
    <div class="patients-container slds-p-around_medium">
        
        <h2 class="section-title slds-m-bottom_medium">
            <svg class="section-icon" viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            My Patients
        </h2>

        <template if:true={hasPatients}>
            <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={patients} for:item="pat">
                    <div key={pat.recordId} class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                        <div class="patient-card" onclick={handleCardClick} data-id={pat.recordId}>
                            <div class="card-header">
                                <div class="patient-info">
                                    <h3 class="patient-name">{pat.name}</h3>
                                    <p class="patient-demographics">
                                        <template if:true={pat.gender}>{pat.gender}</template>
                                        <template if:true={pat.age}> • {pat.age} yrs</template>
                                    </p>
                                </div>
                                <template if:true={pat.bloodGroup}>
                                    <div class="blood-badge">{pat.bloodGroup}</div>
                                </template>
                            </div>
                            
                            <template if:true={pat.phone}>
                                <div class="info-row slds-m-top_small">
                                    <svg class="info-icon" viewBox="0 0 24 24">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                                    </svg>
                                    <span>{pat.phone}</span>
                                </div>
                            </template>

                            <div class="medical-snippet slds-m-top_small">
                                <template if:true={pat.knownAllergies}>
                                    <p class="snippet-text">
                                        <span class="snippet-label">Allergies:</span> {pat.knownAllergies}
                                    </p>
                                </template>
                                <template if:true={pat.chronicConditions}>
                                    <p class="snippet-text slds-m-top_xxx-small">
                                        <span class="snippet-label">Conditions:</span> {pat.chronicConditions}
                                    </p>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasPatients}>
            <div class="empty-state">
                <p>No patients assigned to you currently.</p>
            </div>
        </template>
    </div>
</template>
