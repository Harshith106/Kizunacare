<template>
    <div class="records-container slds-p-around_medium">

        <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-text-align_left">
                <template if:true={isDoctor}>
                    <lightning-button label="New Record" variant="brand" onclick={handleNewRecord}></lightning-button>
                </template>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar slds-m-bottom_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="categoryFilter"
                        label=""
                        variant="label-hidden"
                        value={categoryFilter}
                        placeholder="All Categories"
                        options={categoryOptions}
                        onchange={handleCategoryChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="dateFilter"
                        label=""
                        variant="label-hidden"
                        value={dateFilter}
                        placeholder="All Time"
                        options={dateOptions}
                        onchange={handleDateChange}>
                    </lightning-combobox>
                </div>
            </div>
        </div>

        <!-- Records Grid -->
        <template if:true={hasRecords}>
            <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={filteredRecords} for:item="rec">
                    <div key={rec.recordId} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-m-bottom_medium">
                        <div class="record-card" onclick={handleCardClick} data-id={rec.recordId}>

                            <!-- Top row: category badge + date -->
                            <div class="card-header slds-m-bottom_small">
                                <div class={rec.categoryClass}>{rec.category}</div>
                                <span class="rec-date">{rec.displayDate}</span>
                            </div>

                            <!-- Record auto-name -->
                            <h3 class="rec-name slds-m-bottom_small">{rec.recordName}</h3>

                            <!-- People -->
                            <div class="info-row slds-m-top_x-small">
                                <svg class="info-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <span>Patient: <strong>{rec.patientName}</strong></span>
                            </div>
                            <div class="info-row slds-m-top_x-small">
                                <svg class="info-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                <span>Doctor: <strong>{rec.doctorName}</strong></span>
                            </div>

                            <!-- Category-specific field -->
                            <template if:true={rec.medicineName}>
                                <div class="info-row slds-m-top_x-small">
                                    <svg class="info-icon" viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                                    <span>Medicine: <strong>{rec.medicineName}</strong></span>
                                </div>
                            </template>
                            <template if:true={rec.testName}>
                                <div class="info-row slds-m-top_x-small">
                                    <svg class="info-icon" viewBox="0 0 24 24"><path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5s-2.5-1.1-2.5-2.5V2"/><path d="M8.5 2h8"/><path d="M14.5 16h-5"/></svg>
                                    <span>Test: <strong>{rec.testName}</strong></span>
                                </div>
                            </template>
                            <template if:true={rec.vaccineName}>
                                <div class="info-row slds-m-top_x-small">
                                    <svg class="info-icon" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></svg>
                                    <span>Vaccine: <strong>{rec.vaccineName}</strong></span>
                                </div>
                            </template>

                            <!-- Details snippet -->
                            <template if:true={rec.detailsSnippet}>
                                <div class="details-snippet slds-m-top_small">
                                    <p class="snippet-text">{rec.detailsSnippet}</p>
                                </div>
                            </template>

                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasRecords}>
            <div class="empty-state">
                <p>No medical records match your filters.</p>
            </div>
        </template>

    </div>
</template>
